# Azure认知服务安全配置
credentials:
  endpoint: https://{region}.api.cognitive.microsoft.com/sts/v1.0/issuetoken
  auth:
    key: ${AZURE_TTS_KEY}
    region: ${AZURE_TTS_REGION}

# 音频生成参数
settings:
  voice_name: zh-CN-XiaoxiaoNeural
  output_format: audio-24khz-48kbitrate-mono-mp3
  prosody:
    rate: "+10%"
    pitch: "+5Hz"
  cache_ttl: 86400  # 24小时缓存
