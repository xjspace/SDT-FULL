# 音频流核心配置
sample_rate: 16000    # 采样率(Hz)
channels: 1           # 声道数
dtype: float32        # 数据类型
chunk_duration: 0.5   # 数据块时长(秒)
vad_threshold: 0.75   # 语音活动检测阈值

# ASR配置
asr_model: base       # Whisper模型大小 (tiny|base|small|medium)
language: zh          # 默认识别语言
translate: false      # 是否翻译为英文

# 输出配置
output_format: mp3    # 输出格式 (mp3/wav/flac)
bitrate: 192k         # 音频比特率
normalize: true       # 自动音量标准化
