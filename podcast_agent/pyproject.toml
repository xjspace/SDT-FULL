[project]
name = "smolagents"
version = "0.1.0"
description = "轻量级播客处理代理系统"
requires-python = ">=3.9"
dependencies = [
    "aiohttp>=3.9.3",
    "ffmpeg-python>=0.2.0",
    "pydub>=0.25.1",
    "python-dotenv>=1.0.0",
    "speechrecognition (>=3.14.1,<4.0.0)",
    "pyaudio (>=0.2.14,<0.3.0)",
    "webrtcvad (>=2.0.10,<3.0.0)"
]

[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
